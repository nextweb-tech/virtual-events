<style type="text/css">
.accordion-container{
  position: relative;
  max-width: 500px;
  height: auto;
  margin: 10px auto;
}
.accordion-container > h2{
  text-align: center;
  color: #fff;
  padding-bottom: 5px;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid #ddd;
}
.set{
  position: relative;
  width: 100%;
  height: auto;
}
.set > a{
  display: block;
  padding: 10px 15px;
  text-decoration: none;
  color: #555;
  font-weight: 600;
  -webkit-transition:all 0.2s linear;
  -moz-transition:all 0.2s linear;
  transition:all 0.2s linear;
  background-color: #fcee20;
}
.set > a i{
  float: right;
  margin-top: 2px;
}
.set > a.active{
  background-color:#fcee20;
  color: #000;
}
.content{
  background:rgba(5,130,212, .8);
  display:none;
  padding:15px;
}
.content ul li a.active{color:#fcee20 !important; font-weight: 500; text-decoration: underline;;}
.content ul li a{color:#fff; line-height: 28px;}
.content ul li a:hover{color:#fcee20; text-decoration: underline;}
.content p{
  padding: 10px 15px;
  margin: 0;
  color: #fff;
}
</style>

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/jquery.mapify.js"></script>
<script>
$(window).load(function(e) {
	var winHeight = $(window).height();
	$("#enter-content-cont").css("height", winHeight);
});


</script>

<script type="text/javascript">
$(function(){
    
    $("img[usemap]:first").mapify({
        hoverClass: "drop-hover"
    });
    
    $("img[usemap]:last").mapify({
        popOver: {
            content: function(zone){
                return "<img src='"+zone.attr("data-logo")+ "' />" + "<strong>" +zone.attr("data-title")+ "</strong>";
            },
            delay: 0.7,
            margin: "15px",
            height: "130px",
            width: "260px"
        },
        onAreaHighlight: function(){
            console.log("onAreaHighlight callback");
        },
        onMapClear: function(){
            console.log("onMapClear callback");
        }
    });
    
    $("#dynamicClassChange").click(function() {
        $(this).attr("data-hover-class","hover-green");
    });
    
});


$(document).ready(function() {
  $(".set > a").on("click", function() {
    if ($(this).hasClass("active")) {
      $(this).removeClass("active");
      $(this)
        .siblings(".content")
        .slideUp(200);
      $(".set > a i")
        .removeClass("fa-minus")
        .addClass("fa-plus");
    } else {
      $(".set > a i")
        .removeClass("fa-minus")
        .addClass("fa-plus");
      $(this)
        .find("i")
        .removeClass("fa-plus")
        .addClass("fa-minus");
      $(".set > a").removeClass("active");
      $(this).addClass("active");
      $(".content").slideUp(200);
      $(this)
        .siblings(".content")
        .slideDown(200);
    }
  });
});

</script>
