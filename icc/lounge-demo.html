<script>

function autoPlayYouTubeModal(){
  var trigger = $("body").find('[data-toggle="modal"]');
  trigger.click(function() {
    var theModal = $(this).data( "target" ),
    videoSRC = $(this).attr( "data-theVideo" ), 
    videoSRCauto = videoSRC+"?autoplay=1" ;
    $(theModal+' iframe').attr('src', videoSRCauto);
    $(theModal+' button.close').click(function () {
        $(theModal+' iframe').attr('src', videoSRC);
    });   
  });
}

$(document).ready(function(){
  autoPlayYouTubeModal();
});

$(window).load(function(e) {
	var winHeight = $(window).height();
	$("#enter-content-cont").css("height", winHeight);

  $("#news").eocjsNewsticker({
    speed: 25,
    timeout: 0.5
  });

});

$(document).ready(function(e) {
    $('img[usemap]').rwdImageMaps();    
});

$(window).load(function() {
	$('.enter-video-popup').click();
});

setTimeout(function(){
 $(".screen-btn").click();
}, 400);

$("#videoModal .close").click(function(){
    
  setTimeout(function(){
  $("#videoModal .modal-content iframe").attr("src","");
}, 800);

  
});


$("#videoModal2 .close").click(function(){
    
  setTimeout(function(){
  $("#videoModal2 .modal-content iframe").attr("src","");
}, 800);
  
});
  
$('#inline-popups').magnificPopup({
  delegate: 'a',
  removalDelay: 800, //delay removal by X to allow out-animation
  callbacks: {
    beforeOpen: function() {
       this.st.mainClass = this.st.el.attr('data-effect');
    }
  },
  midClick: true // allow opening popup on middle mouse click. Always set it to true if you don't provide alternative source.
});


// Image popups
$('#image-popups').magnificPopup({
  delegate: 'a',
  type: 'image',
  removalDelay: 500, //delay removal by X to allow out-animation
  callbacks: {
    beforeOpen: function() {
      // just a hack that adds mfp-anim class to markup 
       this.st.image.markup = this.st.image.markup.replace('mfp-figure', 'mfp-figure mfp-with-anim');
       this.st.mainClass = this.st.el.attr('data-effect');
    }
  },
  closeOnContentClick: true,
  midClick: true // allow opening popup on middle mouse click. Always set it to true if you don't provide alternative source.
});


// Hinge effect popup
$('a.hinge').magnificPopup({
  mainClass: 'mfp-with-fade',
  removalDelay: 1000, //delay removal by X to allow out-animation
  callbacks: {
    beforeClose: function() {
        this.content.addClass('hinge');
    }, 
    close: function() {
        this.content.removeClass('hinge'); 
    }
  },
  midClick: true
});
</script>
