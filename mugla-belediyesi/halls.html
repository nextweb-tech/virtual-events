<body>

<header id="in-header">
	<div class="container">
        <div class="row">
            <div class="col-md-9">
                <ul id="header-menu">
                    <li><a href="enter.html">Lobi</a></li>
                    <li><a href="exhibition.html">Fuaye</a></li>
                    <li class="active"><a href="halls.html">Ana Sahne</a></li>

                <img src="images/white-logo.png" />

<section id="halls-page-in">
	<div class="halls-page-cont">
        <div class="halls-page-inner">

            <div class="contall extra-hall">
                <div class="box1 allboxs" style="opacity:0;">
                    <h4>virtualsummit</h4>
                    <h5>2020</h5>
                </div>
                <div class="box2 allboxs" style="opacity:0;">
                    <h4>Agenda</h4>
                    <ul id="agenda-ul">
                        <li>
                            <div class="agenda-times">09:00</div>
                            <div class="agenda-text">
                                Introduction
                                <span>Bülent Bayhan, Umut Soyugür</span>
                            </div>
                        </li>
                        <li>
                            <div class="agenda-times">10:00</div>
                            <div class="agenda-text">
                                Eventmagix Virtual event solutions
                                <span>Alpaslan Kilicaslan</span>
                            </div>
                        </li>
                        <li>
                            <div class="agenda-times">11:00</div>
                            <div class="agenda-text">
                                Marketing your virtual event.
                                <span>Yigitcan Guler</span>
                            </div>
                        </li>
                    </ul>
                    <ul id="sponsors-ul">
                        <li><img src="images/hall-sponsor1.gif" /></li>

                        <li><img src="images/hall-sponsor3.gif" /></li>
                    </ul>
                </div>
                <div class="box3 allboxs ps-r">
                    <div id="embedWidget" style="top:0px;">
                    <iframe width="100%" height="328" src="https://player.vimeo.com/video/447789183?autoplay=0" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                     <a href="javascript:void(0);" class="fulls-close-btn">X</a>
					</div>
                    <div class="fullscreen-btn-cont"><a href="javascript:void(0);" class="fullscreen-btn">Fullscreen</a></div>
                </div>
            </div>

        </div>
    </div>
</section>

<style>
.fullsize iframe {
    height: 95vh !important;
}
</style>

<script src="js/jquery.min.js"></script>
<script src="js/jquery.rwdImageMaps.min.js"></script>
<script>

$( ".fullscreen-btn" ).click(function() {
  $("#embedWidget").addClass("fullsize");
});

$( ".fulls-close-btn" ).click(function() {
  $("#embedWidget").removeClass("fullsize");
});

$(window).load(function(e) {
	var winHeight = $(window).height();
	$("#enter-content-cont").css("height", winHeight);
});
</script>
