<html lang="en">

<head>

    <!-- fontawesome -->
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <!-- stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom-bootstrap-margin-padding.css">
    <link rel="stylesheet" href="css/material-design-iconic-font.min.css">
	<link rel="stylesheet" href="css/eocjs-newsticker.css">
	<style>
		#in-header::after {background: rgba(5,130,212, 1)}
		#header-menu li.active a {color: #fcee20 !important;}
		#header-menu li.active::after {background: #fcee20;}
		#header-menu li a {color: #fff;}
		#enter-page::after {background: rgba(5,130,212, .5);}
		
		.schedule-box .tab-buttons .tab-btn.active, .schedule-box .tab-buttons .tab-btn:hover {border-color: #5e6b77;background: #5e6b77;color: #ffffff;}
		.schedule-box .tab-buttons .tab-btn .curve::after {border-top-color: #5e6b77;}
		.schedule-box .tab-buttons .tab-btn {background: #ffffff;color: #009fe3;}
		.schedule-box .hour-box .toggle-btn h3::after {color: #009fe3;}
		.hour-box.active-box .hour {color: #009fe3 !important;}
		.schedule-box .hour-box.active-box .circle {border-color: #009fe3;}
		.schedule-box .hour-box.active-box::before { background: #009fe3;}
		.toggle-btn.active h3 {color: #009fe3 !important;}
		.share-cont {background: #273958;color: #fff;}
		.agenda-dates {background: #17b5e4;color: #fff !important;}
		.agenda-carousel-date1 {background: #6a9ff7; color: #fff;}
		.color1 {color: #17b5e4 !important;}
		.agenda-list a::after {color: #17b5e4;}
		.agenda-buttons a {border: solid 1px #16b5e6;}
		.agenda-buttons a.active {color: #fff !important;background: #16b5e6;}
		.agenda-buttons a {border: solid 1px #16b5e6; color: #16b5e6;}
	</style>
	
</head>

<body>




<section id="enter-page" class="">
	
	<div class=" home-program-v2 pt-100">
	   <div class="container" style="width:690px;">
	      <!--Schedule Box--> 
	     <iframe style="border:none;" width="100%" height="650" src="https://formmagix.com/view.php?id=275981"></iframe>
	      <!--Schedule Box End--> 
	   </div>
	</div>

</section>

<link rel="stylesheet" type="text/css" href="css/programv2/programv2.css">

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/jquery.rwdImageMaps.min.js"></script>
<script src="js/eocjs-newsticker.js"></script>
<script>
$(window).load(function(e) {
	var winHeight = $(window).height();
	$("#enter-content-cont").css("height", winHeight);
	$("#news").eocjsNewsticker({
		speed: 25,
		timeout: 0.5
	  });
});


</script>
<script>
$(".schedule-box .tab-btn").on("click", function () {
    var target = $($(this).attr("data-id"));
    $(".schedule-box .tab-btn").removeClass("active");
    $(this).addClass("active");
    $(".schedule-box .tab").fadeOut(0);
    $(".schedule-box .tab").removeClass("current");
    $(target).fadeIn(300);
    $(target).addClass("current");
    var windowWidth = $(window).width();
    if (windowWidth <= 700) {
        $("html, body").animate({ scrollTop: $(".tabs-box").offset().top }, 1000);
    }
});
$(".schedule-box .hour-box .toggle-btn").on("click", function () {
    var target = $($(this).next(".content-box"));
    $(this).toggleClass("active");
    $(target).slideToggle(300);
    $(target).parents(".hour-box").toggleClass("active-box");
});
</script>
</body>

</html>
